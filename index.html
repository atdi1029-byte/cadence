function renderMonthly() {
  const section = document.getElementById('monthlySection');
  const mk = getMonthKey();
  const items = data.monthly.items || [];

  document.getElementById('monthlyMonth').textContent = getMonthLabel();

  // Progress
  const doneCount = items.filter(i => isMonthlyDone(i.id)).length;
  const progEl = document.getElementById('monthlyProgress');
  progEl.textContent = items.length ? doneCount + '/' + items.length : '';

  // Collapse state
  const collapsed = localStorage.getItem('cadence_monthly_collapsed') === '1';
  const body = document.getElementById('monthlyBody');
  const chev = document.getElementById('monthlyChevron');
  if (collapsed) { body.classList.add('collapsed'); chev.classList.add('collapsed'); }
  else { body.classList.remove('collapsed'); chev.classList.remove('collapsed'); }

  // Auto-expand on the 1st of the month
  if (new Date().getDate() === 1 && items.length > 0 && doneCount < items.length) {
    body.classList.remove('collapsed');
    chev.classList.remove('collapsed');
    localStorage.removeItem('cadence_monthly_collapsed');
  }

  // Render items
  const el = document.getElementById('monthlyItems');
  if (items.length === 0) {
    el.innerHTML = '<div style="font-size:.78rem;color:var(--text-dim);padding:8px 0">No monthly items yet. Add things like rent, bills, reviews...</div>';
    return;
  }
  el.innerHTML = items.map(i => {
    const done = isMonthlyDone(i.id);
    return `<div class="monthly-item${done ? ' m-done' : ''}">
      <div class="monthly-check" onclick="toggleMonthlyItem('${i.id}')">${done ? '\u2713' : ''}</div>
      <div class="monthly-item-text">${esc(titleCase(i.text))}</div>
      <div class="monthly-item-del" onclick="deleteMonthlyItem('${i.id}')">\u00D7</div>
    </div>`;
  }).join('');
}

function loadMonthlyAsTasks() {
  const items = data.monthly.items || [];
  let added = 0;
  items.forEach(i => {
    if (isMonthlyDone(i.id)) return;
    const exists = data.tasks.some(t => !t.completedAt && t.text.toLowerCase() === i.text.toLowerCase());
    if (!exists) {
      addTask(i.text, 'finance');
      added++;
    }
  });
  if (added) {
    saveData();
    renderTasks();
    toast(added + ' monthly tasks added to Today');
  }
}

// Auto-load monthly tasks on the 1st
function checkMonthlyAutoLoad() {
  const today = new Date();
  if (today.getDate() !== 1) return;
  const mk = getMonthKey();
  const lastLoad = localStorage.getItem('cadence_monthly_loaded');
  if (lastLoad === mk) return; // already loaded this month
  const items = data.monthly.items || [];
  if (items.length === 0) return;
  loadMonthlyAsTasks();
  localStorage.setItem('cadence_monthly_loaded', mk);
}

// ===== INSIGHTS VIEW =====
function renderInsights() {
  const el = document.getElementById('insightsContent');
  const now = new Date();
  const today = dateStr(now);

  // Stats
  const todayCompleted = data.history.filter(h => h.completedAt.startsWith(today)).length;
  const todayActive = data.tasks.filter(t => !t.completedAt).length;
  const weekStart = new Date(now);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  const weekStr = dateStr(weekStart);
  const weekCompleted = data.history.filter(h => h.completedAt >= weekStr + 'T00:00:00').length;

  // Day distribution (from freq)
  const dayTotals = [0,0,0,0,0,0,0];
  for (const entry of Object.values(data.freq)) {
    entry.dayDistribution.forEach((v, i) => dayTotals[i] += v);
  }
  const maxDay = Math.max(...dayTotals, 1);
  const busiestDay = dayTotals.indexOf(Math.max(...dayTotals));

  // Time distribution
  const timeTotals = {morning:0,afternoon:0,evening:0,night:0};
  for (const entry of Object.values(data.freq)) {
    for (const [slot, count] of Object.entries(entry.timeSlots)) {
      timeTotals[slot] += count;
    }
  }
  const maxTime = Math.max(...Object.values(timeTotals), 1);

  // Most frequent tasks
  const freqList = Object.entries(data.freq)
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, 10);

  // Streaks
  const streaks = Object.entries(data.freq)
    .filter(([k, v]) => v.streakWeeks >= 3)
    .sort((a, b) => b[1].streakWeeks - a[1].streakWeeks)
    .slice(0, 5);

  const totalCompleted = data.history.length;

  el.innerHTML = `
    <!-- Stats Row -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="insight-card" style="text-align:center">
        <div class="insight-big">${todayCompleted}</div>
        <div class="insight-sub">Done today</div>
      </div>
      <div class="insight-card" style="text-align:center">
        <div class="insight-big">${todayActive}</div>
        <div class="insight-sub">Remaining</div>
      </div>
      <div class="insight-card" style="text-align:center">
        <div class="insight-big">${weekCompleted}</div>
        <div class="insight-sub">This week</div>
      </div>
    </div>

    <!-- Total -->
    <div class="insight-card">
      <div class="insight-title">All Time</div>
      <div class="insight-big">${totalCompleted}</div>
      <div class="insight-sub">Tasks completed \u00B7 ${Object.keys(data.freq).length} Unique tasks learned</div>
    </div>

    <!-- Weekly Heatmap -->
    <div class="insight-card">
      <div class="insight-title">Busiest Days</div>
      ${dayTotals.some(d => d > 0) ? `
        <div class="insight-sub" style="margin-bottom:8px">Most active on ${FULL_DAYS[busiestDay]}s</div>
        <div class="heatmap">
          ${DAY_NAMES.map(d => `<div class="hm-label">${d}</div>`).join('')}
          ${dayTotals.map(d => {
            const intensity = d / maxDay;
            const bg = intensity === 0 ? 'var(--input-bg)' :
              `rgba(${document.documentElement.classList.contains('day') ? '217,119,86' : '144,120,208'},${0.15 + intensity * 0.7})`;
            return `<div class="hm-cell" style="background:${bg}">${d||''}</div>`;
          }).join('')}
        </div>
      ` : '<div class="insight-sub">Complete some tasks to see patterns</div>'}
    </div>

    <!-- Time of Day -->
    <div class="insight-card">
      <div class="insight-title">Time of Day</div>
      <div class="time-bars">
        ${['morning','afternoon','evening','night'].map(slot => {
          const pct = (timeTotals[slot] / maxTime * 100).toFixed(0);
          return `<div class="time-bar">
            <span class="time-bar-label">${TIME_SLOTS[slot]}</span>
            <div class="time-bar-track"><div class="time-bar-fill" style="width:${pct}%"></div></div>
            <span class="time-bar-val">${timeTotals[slot]}</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Most Frequent -->
    ${freqList.length > 0 ? `
    <div class="insight-card">
      <div class="insight-title">Most Frequent</div>
      <div class="freq-list">
        ${freqList.map(([key, v]) => {
          let freq = '';
          if (v.avgGapDays > 0) {
            const gap = Math.round(v.avgGapDays);
            if (gap === 1) freq = 'Daily';
            else if (gap <= 7) freq = 'Every ' + gap + ' days';
            else freq = 'Every ' + Math.round(gap/7) + ' weeks';
          }
          return `<div class="freq-item">
            <span class="freq-name">${esc(v.textOriginal || key)}</span>
            <span class="freq-stat">${v.count}x${freq ? ' \u00B7 ' + freq : ''}</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    <!-- Streaks -->
    ${streaks.length > 0 ? `
    <div class="insight-card">
      <div class="insight-title">Active Streaks</div>
      <div class="freq-list">
        ${streaks.map(([key, v]) => {
          return `<div class="freq-item">
            <span class="freq-name">${esc(v.textOriginal || key)}</span>
            <span class="freq-stat">${v.streakWeeks}-week streak</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
  `;
}

function toggleSetting(key, el) {
  el.classList.toggle('on');
  data.settings[key] = el.classList.contains('on');
  saveData();
}

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cadence-backup-' + dateStr(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Data exported');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function() {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!imported.tasks || !imported.freq) throw new Error('Invalid backup');
        data = imported;
        saveData();
        renderTasks();
        renderSuggestions();
        toast('Data imported successfully');
      } catch(err) {
        toast('Import failed: invalid file');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearHistory() {
  if (!confirm('Clear all task history? This will reset your smart suggestions.')) return;
  data.history = [];
  data.freq = {};
  saveData();
  renderInsights();
  toast('History cleared');
}

// ===== CLOUD SYNC =====
// Set this to your deployed Apps Script URL after deploying apps_script.gs
function getSyncUrl() {
  return localStorage.getItem('cadence_sync_url') || '';
}

function fireGet(url) {
  return new Promise(function(resolve) {
    const img = new Image();
    img.onload = resolve;
    img.onerror = resolve; // Apps Script returns JSON not an image, so onerror = success
    setTimeout(resolve, 5000);
    img.src = url;
  });
}

// JSONP helper — bypasses CORS by loading script tag
function jsonpFetch(url, callback) {
  const cbName = '_cadenceCb_' + Date.now();
  const script = document.createElement('script');
  let done = false;
  window[cbName] = function(resp) {
    done = true;
    delete window[cbName];
    script.remove();
    callback(null, resp);
  };
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  script.onerror = function() {
    if (!done) { delete window[cbName]; script.remove(); callback('Script load failed'); }
  };
  setTimeout(function() {
    if (!done) { delete window[cbName]; script.remove(); callback('Timeout'); }
  }, 15000);
  document.head.appendChild(script);
}

let _syncTimer = null;
let _lastLocalSave = 0;

function syncToCloud() {
  const ep = getSyncUrl();
  if (!ep) return;
  _lastLocalSave = Date.now();
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(_doSync, 2000);
}

function _doSync(showFeedback) {
  _syncTimer = null;
  const ep = getSyncUrl();
  if (!ep) { if (showFeedback) toast('No sync URL set'); return; }
  let payload = JSON.stringify(data);
  if (showFeedback) toast('Pushing ' + data.tasks.length + ' tasks...');
  fetch(ep, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain'},
    body: payload
  }).then(function() {
    if (showFeedback) toast('Saved ' + data.tasks.length + ' tasks to cloud');
  }).catch(function(e) {
    if (showFeedback) toast('Cloud save failed: ' + e.message);
  });
}

function loadFromCloud(showToast) {
  const ep = getSyncUrl();
  if (!ep) {
    if (showToast) toast('No sync URL set');
    return;
  }
  // Don't pull from cloud if there's a pending sync or within 15s of a local save
  if (!showToast && (_syncTimer || Date.now() - _lastLocalSave < 15000)) return;

  if (showToast) toast('Loading from cloud...');
  const loadStartedAt = _lastLocalSave;
  fetch(ep + '?action=load').then(function(resp) {
    return resp.json();
  }).then(function(resp) {
    if (!showToast && _lastLocalSave > loadStartedAt) return;
    if (!resp || !resp.ok) {
      if (showToast) toast('Cloud error: ' + ((resp && resp.error) || 'unknown'));
      return;
    }
    if (!resp.data) {
      if (showToast) toast('Cloud is empty — nothing to restore');
      return;
    }
    let cloud;
    try { cloud = JSON.parse(resp.data); } catch(e) {
      if (showToast) toast('Cloud data corrupted');
      return;
    }
    if (!cloud || !cloud.tasks) {
      if (showToast) toast('Cloud data invalid');
      return;
    }
    if (JSON.stringify(data.tasks) === JSON.stringify(cloud.tasks)) {
      if (showToast) toast('Already up to date');
      return;
    }
    if (!showToast && data.lastModified && (!cloud.lastModified || data.lastModified >= cloud.lastModified)) return;

    data = cloud;
    _origSaveData();
    renderTasks();
    renderSuggestions();
    renderTemplateSuggestions();
    if (currentView === 'insights') renderInsights();
    if (currentView === 'settings') renderSettings();
    if (showToast) toast('Synced ' + cloud.tasks.length + ' tasks from cloud');
  }).catch(function(e) {
    if (showToast) toast('Cloud fetch failed: ' + e.message);
  });
}

// Auto-sync after every save
const _origSaveData = saveData;
saveData = function() {
  _origSaveData();
  syncToCloud();
};

// ===== INITIALIZATION =====
function init() {
  loadData();
  pruneHistory();
  initTheme();
  updateGreeting();
  renderTasks();
  renderSuggestions();
  renderTemplateSuggestions();
  checkMonthlyAutoLoad();

  // Auto-load from cloud on startup — only applies if cloud data is newer (timestamp guard)
  setTimeout(function() { loadFromCloud(false); }, 1500);

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }

  // Auto-refresh theme every minute
  setInterval(function() {
    initTheme();
    updateGreeting();
  }, 60000);
}

init();
