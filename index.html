<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c1a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cadence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{font-family:'Inter',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background .6s,color .6s}
input,button,textarea,select{font-family:inherit;font-size:inherit;border:none;outline:none;background:none}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* ===== CSS VARIABLES — Night Mode (default) — teal & orange ===== */
:root{
  --bg:#0c1a22;
  --bg-grad:linear-gradient(145deg,#0c1a22 0%,#0a2028 30%,#081820 60%,#0c1a22 100%);
  --card:rgba(10,28,38,0.65);
  --card-border:rgba(100,200,200,0.12);
  --card-shadow:0 2px 16px rgba(0,0,0,0.35),0 0 40px rgba(80,180,180,0.04);
  --input-bg:rgba(8,22,30,0.8);
  --text:#7aacac;
  --text-dim:#5a8888;
  --text-bright:#f0e0d0;
  --accent:#6ecfcf;
  --accent-glow:rgba(110,207,207,0.2);
  --accent-deep:#4aadad;
  --orange:#e8944c;
  --orange-glow:rgba(232,148,76,0.15);
  --green:#5ab880;
  --green-bg:rgba(90,184,128,0.12);
  --red:#d06060;
  --red-bg:rgba(208,96,96,0.1);
  --gold:#e8a840;
  --cat-personal:#6ecfcf;
  --cat-errands:#e8944c;
  --cat-work:#60a0d0;
  --cat-groceries:#5ab880;
  --cat-health:#d080a0;
  --cat-home:#e8a840;
  --cat-finance:#60c8b0;
  --radius:14px;
  --radius-sm:8px;
  --nav-bg:rgba(10,22,30,0.92);
  --nav-border:rgba(100,200,200,0.08);
  --blur:blur(16px);
  --pill-bg:rgba(110,207,207,0.1);
  --pill-border:rgba(110,207,207,0.2);
  --modal-bg:rgba(10,22,30,0.95);
  --toast-bg:rgba(12,26,34,0.95);
  --suggestion-bg:rgba(232,148,76,0.08);
}

/* ===== Day Mode ===== */
:root.day{
  --bg:#faf6f0;
  --bg-grad:linear-gradient(145deg,#faf6f0 0%,#f5ede0 50%,#faf8f4 100%);
  --card:rgba(255,255,255,0.85);
  --card-border:rgba(180,160,130,0.18);
  --card-shadow:0 2px 12px rgba(0,0,0,0.06);
  --input-bg:rgba(255,255,255,0.9);
  --text:#5a5040;
  --text-dim:#a09880;
  --text-bright:#2a2420;
  --accent:#d97756;
  --accent-glow:rgba(217,119,86,0.15);
  --accent-deep:#c46040;
  --orange:#d97756;
  --orange-glow:rgba(217,119,86,0.12);
  --green:#4a8860;
  --green-bg:rgba(74,136,96,0.1);
  --red:#c04848;
  --red-bg:rgba(192,72,72,0.08);
  --gold:#b89830;
  --cat-personal:#d97756;
  --cat-errands:#c46040;
  --cat-work:#5080c0;
  --cat-groceries:#4a8860;
  --cat-health:#c05080;
  --cat-home:#b89830;
  --cat-finance:#409888;
  --nav-bg:rgba(250,246,240,0.94);
  --nav-border:rgba(180,160,130,0.15);
  --blur:blur(12px);
  --pill-bg:rgba(217,119,86,0.1);
  --pill-border:rgba(217,119,86,0.25);
  --modal-bg:rgba(250,246,240,0.97);
  --toast-bg:rgba(255,255,255,0.95);
  --suggestion-bg:rgba(217,119,86,0.06);
}

/* ===== LAYOUT ===== */
body{background:var(--bg);background-image:var(--bg-grad);color:var(--text);padding-bottom:calc(70px + env(safe-area-inset-bottom))}

/* Background mascot */
.bg-mascot{
  position:fixed;top:0;left:0;
  width:100vw;height:100vh;
  object-fit:cover;object-position:top center;
  opacity:0.6;pointer-events:none;z-index:0;
  transition:opacity .6s;
}
:root.day .bg-mascot{opacity:0.09}

.app-header{
  position:sticky;top:0;z-index:100;
  padding:calc(env(safe-area-inset-top,12px) + 8px) 16px 10px;
  background:var(--nav-bg);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--nav-border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background .6s;text-align:center;
}
.app-header h1{
  font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;
  color:var(--text-bright);letter-spacing:-0.02em;
}
.header-greeting{font-size:.82rem;color:var(--orange, var(--text-dim));margin-top:2px;opacity:.8}
.header-right{display:flex;align-items:center;gap:8px}
.theme-toggle{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;background:var(--pill-bg);border:1px solid var(--pill-border);
  transition:all .3s;
}
.theme-toggle:active{transform:scale(.9)}

/* ===== CONTENT ===== */
.content{max-width:600px;margin:0 auto;padding:12px 16px;position:relative;z-index:1}

/* ===== QUICK ADD ===== */
.quick-add{
  display:flex;gap:8px;align-items:center;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:8px 12px;
  box-shadow:var(--card-shadow);position:relative;
  transition:border-color .2s,background .6s;
}
.quick-add:focus-within{border-color:var(--accent)}
.quick-add input{
  flex:1;background:transparent;color:var(--text-bright);
  font-size:1rem;padding:6px 0;
}
.quick-add input::placeholder{color:var(--text-dim)}
.quick-add .cat-btn{
  padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
  border:1px solid var(--pill-border);color:var(--accent);
  background:var(--pill-bg);transition:all .2s;white-space:nowrap;
}
.quick-add .add-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:1.2rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,background .2s;flex-shrink:0;
}
.quick-add .add-btn:active{transform:scale(.9)}
.spacer-btn{
  font-size:.68rem;color:var(--text-dim);padding:2px 8px;
  border:none;background:none;opacity:.5;
}
.spacer-btn:active{opacity:1}

/* ===== AUTOCOMPLETE ===== */
.autocomplete{
  position:absolute;top:100%;left:0;right:0;z-index:50;
  background:var(--modal-bg);border:1px solid var(--card-border);
  border-radius:0 0 var(--radius) var(--radius);
  box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;
  max-height:200px;overflow-y:auto;
}
.autocomplete.open{display:block}
.ac-item{
  padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid var(--card-border);
  transition:background .15s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.selected{background:var(--accent-glow)}
.ac-item .ac-text{color:var(--text-bright);font-size:.9rem}
.ac-item .ac-meta{font-size:.7rem;color:var(--text-dim)}

/* ===== CATEGORY PICKER (modal dropdown) ===== */
.cat-picker{
  position:absolute;top:100%;right:50px;z-index:51;
  background:var(--modal-bg);border:1px solid var(--card-border);
  border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,.3);
  padding:6px 0;display:none;min-width:140px;
}
.cat-picker.open{display:block}
.cat-opt{
  padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;
  font-size:.85rem;color:var(--text);transition:background .15s;
}
.cat-opt:hover{background:var(--accent-glow)}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ===== SUGGESTIONS ===== */
.suggestions-section{margin:14px 0 8px}
.suggestions-header{
  font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-dim);margin-bottom:8px;padding:0 2px;
}
.suggestion-pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.suggestion-pills::-webkit-scrollbar{display:none}
.s-pill{
  padding:7px 14px;border-radius:20px;font-size:.82rem;font-weight:500;
  background:rgba(80,140,220,0.15);border:1px solid rgba(80,140,220,0.3);
  color:rgba(232,148,76,0.8);white-space:nowrap;cursor:pointer;
  transition:all .2s;flex-shrink:0;position:relative;
}
:root.day .s-pill{color:var(--text-bright);background:#f8eae4;border-color:rgba(217,119,86,0.2)}
.s-pill:active{transform:scale(.95)}
.s-pill .s-reason{
  display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--toast-bg);border:1px solid var(--card-border);border-radius:6px;
  padding:4px 10px;font-size:.68rem;color:var(--text-dim);white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.s-pill:hover .s-reason{display:block}

/* ===== TEMPLATE SUGGESTION BANNER ===== */
.tmpl-banner{
  background:var(--suggestion-bg);border:1px solid var(--pill-border);
  border-radius:var(--radius);padding:12px 14px;margin:8px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.tmpl-banner-text{font-size:.85rem;color:var(--text)}
.tmpl-banner-text strong{color:var(--text-bright)}
.tmpl-banner-btn{
  padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:600;
  background:var(--accent);color:#fff;transition:transform .15s;
}
.tmpl-banner-btn:active{transform:scale(.95)}
.tmpl-banner-x{
  padding:4px 8px;color:var(--text-dim);font-size:1.1rem;cursor:pointer;
}

/* ===== MONTHLY TO-DO ===== */
/* ===== WEEKLY GOALS ===== */
.weekly-section{
  margin-top:20px;background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;
}
.weekly-header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
  transition:background .2s;
}
.weekly-header:active{background:rgba(255,255,255,0.03)}
.weekly-title-row{display:flex;align-items:center;gap:8px;flex:1}
.weekly-icon{display:flex;align-items:center;color:var(--accent)}
.weekly-title{font-size:.85rem;font-weight:700;color:var(--text-bright);text-transform:uppercase;letter-spacing:.05em}
.weekly-week{font-size:.72rem;color:var(--text-dim);font-weight:500}
.weekly-progress{font-size:.7rem;font-weight:600;color:var(--green);padding:2px 8px;border-radius:10px;background:var(--green-bg)}
.weekly-chevron{font-size:.6rem;color:var(--text-dim);transition:transform .2s}
.weekly-chevron.collapsed{transform:rotate(-90deg)}
.weekly-body{padding:0 16px 14px}
.weekly-body.collapsed{display:none}
.weekly-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.weekly-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--card-border);
}
.weekly-item:last-child{border-bottom:none}
.weekly-item-info{flex:1;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.weekly-item-top{display:flex;align-items:center;gap:8px}
.weekly-item-text{font-size:.85rem;color:var(--text-bright);font-weight:500}
.weekly-item-count{font-size:.75rem;font-weight:600;color:var(--accent)}
.weekly-item.w-done .weekly-item-count{color:var(--green)}
.weekly-item.w-done .weekly-item-text{color:var(--green);opacity:.8}
.weekly-bar{height:4px;border-radius:2px;background:var(--card-border);overflow:hidden}
.weekly-bar-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s}
.weekly-item.w-done .weekly-bar-fill{background:var(--green)}
.weekly-item-del{color:var(--text-dim);font-size:.9rem;cursor:pointer;padding:4px 6px;opacity:.5;transition:opacity .2s}
.weekly-item-del:active{opacity:1}
.weekly-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.weekly-add-name{
  flex:1;min-width:100px;padding:8px 12px;border-radius:var(--radius-sm);
  background:var(--input-bg);border:1px solid var(--card-border);
  color:var(--text-bright);font-size:.82rem;
}
.weekly-add-target{
  width:50px;padding:8px;border-radius:var(--radius-sm);text-align:center;
  background:var(--input-bg);border:1px solid var(--card-border);
  color:var(--text-bright);font-size:.82rem;
}
.weekly-add-unit{
  padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--input-bg);border:1px solid var(--card-border);
  color:var(--accent);font-size:.78rem;font-weight:600;cursor:pointer;
}
.weekly-add-btn{
  width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;
}

.monthly-section{
  margin-top:20px;background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;
}
.monthly-header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
  transition:background .2s;
}
.monthly-header:active{background:rgba(255,255,255,0.03)}
.monthly-title-row{display:flex;align-items:center;gap:8px;flex:1}
.monthly-icon{display:flex;align-items:center;color:var(--orange)}
.monthly-title{font-size:.85rem;font-weight:700;color:var(--text-bright);text-transform:uppercase;letter-spacing:.05em}
.monthly-month{font-size:.72rem;color:var(--text-dim);font-weight:500}
.monthly-progress{font-size:.7rem;font-weight:600;color:var(--green);padding:2px 8px;border-radius:10px;background:var(--green-bg)}
.monthly-chevron{font-size:.6rem;color:var(--text-dim);transition:transform .2s}
.monthly-chevron.collapsed{transform:rotate(-90deg)}
.monthly-body{padding:0 16px 14px}
.monthly-body.collapsed{display:none}
.monthly-items{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.monthly-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--card-border);
}
.monthly-item:last-child{border-bottom:none}
.monthly-check{
  width:18px;height:18px;border-radius:5px;border:2px solid var(--text-dim);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:transparent;cursor:pointer;transition:all .2s;
}
.monthly-item.m-done .monthly-check{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.monthly-item-text{font-size:.85rem;color:var(--text-bright);flex:1}
.monthly-item.m-done .monthly-item-text{text-decoration:line-through;opacity:.5}
.monthly-item-del{color:var(--text-dim);font-size:.9rem;cursor:pointer;padding:4px 6px;opacity:.5;transition:opacity .2s}
.monthly-item-del:active{opacity:1}
.monthly-add{display:flex;gap:6px;align-items:center}
.monthly-input{
  flex:1;padding:8px 12px;border-radius:var(--radius-sm);
  background:var(--input-bg);border:1px solid var(--card-border);
  color:var(--text-bright);font-size:.82rem;
}
.monthly-add-btn{
  width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* ===== TASK LIST ===== */
.task-section-label{
  font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-dim);margin:18px 0 8px;padding:0 2px;
}
.task-list{display:flex;flex-direction:column;gap:6px}

/* ===== TASK CARD ===== */
.task-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  position:relative;overflow:hidden;
  transition:transform .2s,opacity .3s,background .6s;
  touch-action:pan-y;
}
.task-card.completing{
  transform:translateX(-100%);opacity:0;
  transition:transform .35s ease-in,opacity .35s ease-in;
}
.task-card.completed-card{opacity:.5}
.task-card.completed-card .task-text{text-decoration:line-through;color:var(--text-dim)}

/* Swipe actions behind the card */
.swipe-actions{
  position:absolute;top:0;right:0;bottom:0;
  display:flex;align-items:stretch;opacity:0;
  transition:opacity .15s;
}
.swipe-act{
  display:flex;align-items:center;justify-content:center;
  width:70px;font-size:.75rem;font-weight:600;color:#fff;letter-spacing:.03em;
}
.swipe-done{background:var(--green)}
.swipe-del{background:var(--red)}

/* Drag handle */
.drag-handle{
  color:var(--text-dim);font-size:1.1rem;cursor:grab;
  padding:2px 0 2px 2px;flex-shrink:0;touch-action:none;
  opacity:.4;transition:opacity .2s;user-select:none;
  display:flex;align-items:center;letter-spacing:-2px;
  margin-left:auto;
}
.drag-handle:active{cursor:grabbing;opacity:.8}
.task-card.dragging{opacity:.4;transform:scale(.97);transition:opacity .15s,transform .15s}
.task-card.drag-over{border-top:2px solid var(--accent);margin-top:-1px}

/* Subtasks */
.subtask-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.subtask{
  display:flex;align-items:center;gap:8px;padding:4px 0;
  cursor:pointer;transition:opacity .15s;
}
.subtask-done{opacity:.5}
.subtask-done .subtask-text{text-decoration:line-through}
.subtask-check{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--text-dim);
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;color:transparent;flex-shrink:0;
}
.subtask-done .subtask-check{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.subtask-text{font-size:.8rem;color:var(--text-bright)}
.task-sub-count{font-size:.68rem;color:var(--text-dim);background:var(--pill-bg);padding:1px 6px;border-radius:8px}

/* Pill groups (eat / shave / shower) */
.pill-group{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.pill-item{
  padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:500;
  background:var(--pill-bg);border:1px solid var(--pill-border);
  color:var(--text-bright);cursor:pointer;transition:all .2s;
  user-select:none;-webkit-user-select:none;
}
.pill-item:active{transform:scale(.94)}
.pill-item.pill-done{
  opacity:.45;text-decoration:line-through;
  border-color:var(--green);background:var(--green-bg);color:var(--green);
}

/* Checkbox */
.task-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--text-dim);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:.8rem;color:transparent;
}
.task-check:active{transform:scale(.85)}
.task-card.completed-card .task-check{
  border-color:var(--green);background:var(--green-bg);color:var(--green);
}

.task-body{flex:1;min-width:0}
.task-text{font-size:.92rem;color:var(--orange, var(--accent));opacity:.8;line-height:1.35;word-break:break-word}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.task-cat{
  font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 8px;border-radius:10px;
}
.task-time{
  font-size:.95rem;font-weight:600;color:var(--orange, var(--accent));
  margin-left:auto;flex-shrink:0;align-self:center;padding-left:8px;
}
.task-priority{color:var(--gold);font-size:.85rem}
.task-hold-star{
  position:absolute;bottom:4px;right:6px;
  font-size:1.1rem;color:var(--gold);opacity:.7;
}

/* Spacer dividers */
.section-spacer{
  display:flex;align-items:center;
  min-height:76px;padding:0 12px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:stretch;
  background:var(--nav-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--nav-border);
  padding-bottom:env(safe-area-inset-bottom);
  transition:background .6s;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 0 6px;gap:2px;color:var(--text-dim);font-size:.65rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;transition:color .2s;
}
.nav-btn .nav-icon{display:flex;align-items:center;justify-content:center;transition:color .2s}
.nav-btn .nav-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active,.nav-btn.active .nav-icon{color:var(--accent)}

/* ===== VIEWS ===== */
.view{display:none}
.view.active{display:block}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.5);
  display:none;align-items:flex-end;justify-content:center;
  transition:opacity .2s;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--modal-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--card-border);
  border-radius:var(--radius) var(--radius) 0 0;
  width:100%;max-width:600px;max-height:85vh;overflow-y:auto;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .25s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{
  font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;
  color:var(--text-bright);margin-bottom:16px;
}
.modal-close{
  position:absolute;top:16px;right:16px;font-size:1.3rem;
  color:var(--text-dim);cursor:pointer;padding:4px;
}

/* ===== FORM ELEMENTS ===== */
.form-group{margin-bottom:14px}
.form-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;display:block}
.form-input{
  width:100%;padding:10px 14px;border-radius:var(--radius-sm);
  background:var(--input-bg);border:1px solid var(--card-border);
  color:var(--text-bright);font-size:.9rem;transition:border-color .2s;
}
.form-input:focus{border-color:var(--accent)}
.form-select{
  width:100%;padding:10px 14px;border-radius:var(--radius-sm);
  background:var(--input-bg);border:1px solid var(--card-border);
  color:var(--text-bright);font-size:.9rem;
  -webkit-appearance:none;appearance:none;
}
.form-btn{
  width:100%;padding:12px;border-radius:var(--radius-sm);
  background:var(--accent);color:#fff;font-size:.9rem;font-weight:600;
  transition:transform .15s;
}
.form-btn:active{transform:scale(.98)}
.form-btn-outline{
  background:transparent;border:1px solid var(--accent);color:var(--accent);
}
.form-btn-danger{background:var(--red)}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg);border:1px solid var(--card-border);
  border-radius:var(--radius-sm);padding:10px 18px;
  font-size:.85rem;color:var(--text-bright);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:all .3s;z-index:300;
  display:flex;align-items:center;gap:10px;
}
.toast.visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-undo{color:var(--accent);font-weight:600;cursor:pointer}

/* ===== INSIGHTS ===== */
.insight-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--card-shadow);transition:background .6s;
}
.insight-title{
  font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--orange);margin-bottom:10px;
}
.insight-big{font-size:2rem;font-weight:700;color:var(--text-bright)}
.insight-sub{font-size:.8rem;color:var(--text-dim);margin-top:2px}

/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.hm-cell{
  aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:600;color:var(--text-dim);
  transition:background .3s;
}
.hm-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);text-align:center}

/* Time bars */
.time-bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.time-bar{display:flex;align-items:center;gap:8px}
.time-bar-label{font-size:.72rem;color:var(--text-dim);width:60px;text-align:right}
.time-bar-track{flex:1;height:20px;background:var(--input-bg);border-radius:10px;overflow:hidden}
.time-bar-fill{height:100%;border-radius:10px;background:var(--accent);transition:width .5s}
.time-bar-val{font-size:.72rem;color:var(--text-dim);width:28px}

/* Frequent tasks */
.freq-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.freq-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--card-border)}
.freq-item:last-child{border-bottom:none}
.freq-name{font-size:.85rem;color:var(--text-bright)}
.freq-stat{font-size:.75rem;color:var(--text-dim)}

/* ===== TEMPLATE CARDS ===== */
.tmpl-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
  box-shadow:var(--card-shadow);cursor:pointer;transition:all .2s;
}
.tmpl-card:active{transform:scale(.99)}
.tmpl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tmpl-name{font-size:1rem;font-weight:600;color:var(--text-bright)}
.tmpl-count{font-size:.75rem;color:var(--text-dim)}
.tmpl-items-preview{font-size:.8rem;color:var(--text);line-height:1.4}
.tmpl-meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.72rem;color:var(--text-dim)}
.tmpl-add-btn{
  display:flex;align-items:center;justify-content:center;
  padding:14px;border:2px dashed var(--card-border);
  border-radius:var(--radius);color:var(--text-dim);font-size:.9rem;
  margin-bottom:10px;cursor:pointer;transition:all .2s;
}
.tmpl-add-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ===== SETTINGS ===== */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--card-border);
}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:.9rem;color:var(--text-bright)}
.setting-desc{font-size:.75rem;color:var(--text-dim);margin-top:2px}
.toggle{
  width:44px;height:26px;border-radius:13px;
  background:var(--text-dim);position:relative;cursor:pointer;transition:background .2s;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .2s;
}
.toggle.on::after{transform:translateX(18px)}

/* ===== EMPTY STATE ===== */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-dim);
}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.empty-text{font-size:.9rem;line-height:1.5}

/* ===== RESPONSIVE ===== */
@media(max-width:380px){
  .content{padding:10px 12px}
  .app-header h1{font-size:1.25rem}
  .task-card{padding:10px 12px;gap:10px}
}
</style>
</head>
<body>

          <span class="weekly-title">Weekly</span>

        <div class="weekly-add">

          <input type="number" id="weeklyTargetInput" placeholder="#" class="weekly-add-target" min="1" value="1">
          <button class="weekly-add-unit" id="weeklyUnitBtn" onclick="toggleWeeklyUnit()">times</button>

          <span class="monthly-title">Monthly</span>

      </div>
      <div class="monthly-body" id="monthlyBody">
        <div class="monthly-items" id="monthlyItems"></div>
        <div class="monthly-add">
          <input type="text" id="monthlyInput" placeholder="Add monthly item..." class="monthly-input" onkeydown="if(event.key==='Enter')addMonthlyItem()">
          <button class="monthly-add-btn" onclick="addMonthlyItem()">+</button>

</div>

<!-- ===== VIEW: INSIGHTS ===== -->
<div id="view-insights" class="view">
  <div class="content" id="insightsContent"></div>
</div>

<!-- ===== VIEW: SETTINGS ===== -->

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="today" onclick="showView('today',this)">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg></span><span>Today</span>
  </button>
  <button class="nav-btn" data-view="routines" onclick="showView('routines',this)">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></span><span>Routines</span>

    <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001.08 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1.08z"/></svg></span><span>Settings</span>
  </button>

<script>
/* ===================================================================
   CADENCE — Smart Daily Tasks & Routines
   =================================================================== */

// ===== CONSTANTS =====
const STORAGE_KEY = 'cadence_data_v1';
const CATEGORIES = {
  personal: {label:'Personal', color:'var(--cat-personal)'},
  errands:  {label:'Errands',  color:'var(--cat-errands)'},
  work:     {label:'Work',     color:'var(--cat-work)'},
  groceries:{label:'Groceries',color:'var(--cat-groceries)'},
  health:   {label:'Health',   color:'var(--cat-health)'},
  home:     {label:'Home',     color:'var(--cat-home)'},
  finance:  {label:'Finance',  color:'var(--cat-finance)'}
};
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const FULL_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TIME_SLOTS = {morning:'Morning',afternoon:'Afternoon',evening:'Evening',night:'Night'};

// ===== GLOBAL STATE =====
let data = null;
let currentView = 'today';
let selectedCategory = 'personal';
let acIndex = -1; // autocomplete selection index
let toastTimer = null;
let lastUndoAction = null;

// ===== DATA PERSISTENCE =====
function loadData() {
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!data) throw 0;
    // ensure all fields
    if (!data.tasks) data.tasks = [];
    if (!data.history) data.history = [];
    if (!data.freq) data.freq = {};
    if (!data.templates) data.templates = [];
    if (!data.monthly) data.monthly = {items:[], done:{}};
    if (!data.weekly) data.weekly = {items:[], log:{}};
    if (!data.settings) data.settings = {};
  } catch(e) {
    data = {
      tasks: [],
      history: [],
      freq: {},
      templates: [],
      monthly: {items:[], done:{}},
      weekly: {items:[], log:{}},
      settings: {
        name: '',
        defaultCategory: 'personal',
        sortOrder: 'priority',
        suggestionsEnabled: true,
        templateAutoLoad: true,
        themeOverride: null // null=auto, 'day', 'night'
      }
    };
  }
}

function saveData() {
  data.lastModified = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ===== THEME =====
function getTimeSlot(hour) {
  if (hour >= 5 && hour < 12) return 'morning';
  if (hour >= 12 && hour < 17) return 'afternoon';
  if (hour >= 17 && hour < 21) return 'evening';
  return 'night';
}

function getAutoTheme() {
  const h = new Date().getHours();
  const m = new Date().getMinutes();
  // Day: 6:00am - 8:29pm, Night: 8:30pm - 5:59am
  if (h > 6 && h < 20) return 'day';
  if (h === 6) return 'day';
  if (h === 20 && m < 30) return 'day';
  return 'night';
}

function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'day') {
    root.classList.add('day');
    document.querySelector('meta[name="theme-color"]').content = '#faf6f0';
  } else {
    root.classList.remove('day');
    document.querySelector('meta[name="theme-color"]').content = '#0c1a22';
  }
}

function initTheme() {
  applyTheme(getAutoTheme());
}

// ===== GREETING =====
function updateGreeting() {
  const h = new Date().getHours();
  const name = data.settings.name;
  let greet;
  if (h >= 5 && h < 12) greet = 'Good morning';
  else if (h >= 12 && h < 17) greet = 'Good afternoon';
  else if (h >= 17 && h < 21) greet = 'Good evening';
  else greet = 'Good night';
  if (name) greet += ', ' + name;
  const d = new Date();
  const dateStr = FULL_DAYS[d.getDay()] + ', ' +
    d.toLocaleDateString('en-US', {month:'short',day:'numeric'});
  document.getElementById('greeting').textContent = greet + ' \u00B7 ' + dateStr;
}

// ===== VIEW MANAGEMENT =====
function showView(viewId, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    document.querySelectorAll('.nav-btn').forEach(b => {
      if (b.dataset.view === viewId) b.classList.add('active');
    });
  }
  currentView = viewId;
  if (viewId === 'today') { renderTasks(); renderSuggestions(); renderTemplateSuggestions(); }
  if (viewId === 'routines') { renderRoutines(); renderWeekly(); renderMonthly(); }
  if (viewId === 'insights') renderInsights();
  if (viewId === 'settings') renderSettings();
}

// ===== TOAST =====
function toast(msg, undoFn) {
  const el = document.getElementById('toast');
  el.innerHTML = msg + (undoFn ? ' <span class="toast-undo" onclick="doUndo()">Undo</span>' : '');
  lastUndoAction = undoFn || null;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('visible'); lastUndoAction = null; }, 3500);
}

function doUndo() {
  if (lastUndoAction) { lastUndoAction(); lastUndoAction = null; }
  document.getElementById('toast').classList.remove('visible');
}

// ===== MODAL =====
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  history.pushState({modal:true}, '');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

window.addEventListener('popstate', function(e) {
  if (document.getElementById('modalOverlay').classList.contains('open')) {
    closeModal();
  }
});

// ===== ID GENERATION =====
function genId(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,4);
}

// ===== CATEGORY PICKER =====
function toggleCatPicker() {
  const el = document.getElementById('catPicker');
  if (el.classList.contains('open')) { el.classList.remove('open'); return; }
  let html = '';
  for (const [k,v] of Object.entries(CATEGORIES)) {
    html += `<div class="cat-opt" onclick="selectCategory('${k}')">
      <span class="cat-dot" style="background:${v.color}"></span>${v.label}</div>`;
  }
  el.innerHTML = html;
  el.classList.add('open');
}

function selectCategory(cat) {
  selectedCategory = cat;
  document.getElementById('catBtn').textContent = CATEGORIES[cat].label.toLowerCase();
  document.getElementById('catPicker').classList.remove('open');
  renderSuggestions();
}

// Close pickers on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('#catPicker') && !e.target.closest('#catBtn')) {
    document.getElementById('catPicker').classList.remove('open');
  }
  if (!e.target.closest('.quick-add')) {
    document.getElementById('autocomplete').classList.remove('open');
  }
});

// ===== TASK CRUD =====
function addTask(text, category, opts) {
  opts = opts || {};
  const task = {
    id: genId('t'),
    text: text.trim(),
    category: category || selectedCategory,
    createdAt: new Date().toISOString(),
    completedAt: null,
    dueTime: opts.dueTime || null,
    fromTemplate: opts.fromTemplate || null,
    fromSuggestion: opts.fromSuggestion || false,
    priority: opts.priority || 0
  };
  // Insert before any starred/priority tasks, spacers, or held tasks
  let insertIdx = -1;
  for (let i = 0; i < data.tasks.length; i++) {
    const t = data.tasks[i];
    if (!t.completedAt && (t.priority || t.hold || t.isHeader)) {
      insertIdx = i;
      break;
    }
  }
  if (insertIdx >= 0) {
    data.tasks.splice(insertIdx, 0, task);
  } else {
    // No starred/held/spacer tasks — add at end of active tasks
    let lastActive = -1;
    for (let i = data.tasks.length - 1; i >= 0; i--) {
      if (!data.tasks[i].completedAt) { lastActive = i + 1; break; }
    }
    if (lastActive >= 0) data.tasks.splice(lastActive, 0, task);
    else data.tasks.unshift(task);
  }
  saveData();
  renderTasks();
  renderSuggestions();
  return task;
}

function addTaskFromInput() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;

  // Check for spacer: "---" or "--" or "-"
  if (/^-{1,3}$/.test(text)) {
    const task = addTask('---', 'personal');
    task.isHeader = true;
    saveData();
    renderTasks();
    input.value = '';
    document.getElementById('autocomplete').classList.remove('open');
    acIndex = -1;
    return;
  }

  // Check for grouped items: "eat / shave / shower"
  if (text.includes('/')) {
    const items = text.split('/').map(s => s.trim()).filter(s => s);
    if (items.length >= 2) {
      // Create a single task with pills (stored as subtasks, rendered as pills)
      const groupName = items.join(' / ');
      const key = groupName.toLowerCase();
      const freqEntry = data.freq[key];
      const cat = freqEntry ? freqEntry.category : selectedCategory;
      const task = addTask(groupName, cat);
      // Auto-create subtasks from the items
      task.subtasks = items.map(item => ({text: item, done: false}));
      task.isPillGroup = true;
      saveData();
      renderTasks();
      input.value = '';
      document.getElementById('autocomplete').classList.remove('open');
      acIndex = -1;
      toast(items.length + ' items added as group');
      return;
    }
  }

  // Normal single task
  const key = text.toLowerCase();
  const freqEntry = data.freq[key];
  const cat = freqEntry ? freqEntry.category : selectedCategory;
  addTask(text, cat);
  input.value = '';
  document.getElementById('autocomplete').classList.remove('open');
  acIndex = -1;
  toast('Task added');
}

function addSpacer(bottom) {
  const task = {
    id: genId('t'),
    text: '---',
    category: 'personal',
    createdAt: new Date().toISOString(),
    completedAt: null,
    isHeader: true
  };
  if (bottom) {
    data.tasks.push(task);
  } else {
    data.tasks.unshift(task);
  }
  saveData();
  renderTasks();
  renderSuggestions();
}

function completeTask(id) {
  const idx = data.tasks.findIndex(t => t.id === id);
  if (idx < 0) return;
  const task = data.tasks[idx];
  if (task.completedAt) {
    // Un-complete
    task.completedAt = null;
    saveData();
    renderTasks();
    return;
  }
  task.completedAt = new Date().toISOString();
  recordCompletion(task);
  saveData();

  // Animate
  const card = document.getElementById('card-' + id);
  if (card) {
    card.classList.add('completing');
    setTimeout(() => renderTasks(), 350);
  } else {
    renderTasks();
  }
  renderSuggestions();

  // Save for undo
  const undoTask = JSON.parse(JSON.stringify(task));
  toast('Task completed', function() {
    const t = data.tasks.find(x => x.id === id);
    if (t) { t.completedAt = null; saveData(); renderTasks(); renderSuggestions(); }
  });
}

function deleteTask(id) {
  const idx = data.tasks.findIndex(t => t.id === id);
  if (idx < 0) return;
  const removed = data.tasks.splice(idx, 1)[0];
  saveData();
  renderTasks();
  renderSuggestions();
  toast('Task deleted', function() {
    data.tasks.push(removed);
    saveData();
    renderTasks();
    renderSuggestions();
  });
}

function togglePriority(id) {
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;
  task.priority = task.priority ? 0 : 1;
  saveData();
  renderTasks();
}

// ===== RENDER TASKS =====
function renderTasks() {
  const active = data.tasks.filter(t => !t.completedAt);
  const twoMinsAgo = new Date(Date.now() - 120000).toISOString();
  const completed = data.tasks.filter(t => t.completedAt && t.completedAt >= twoMinsAgo);

  // Respect user's manual drag order — stars are visual only, no auto-sort

  // Sort completed by completion time (newest first)
  completed.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

  const taskList = document.getElementById('taskList');
  const compList = document.getElementById('completedList');
  const activeLabel = document.getElementById('activeLabel');
  const compLabel = document.getElementById('completedLabel');
  const empty = document.getElementById('emptyState');

  if (active.length === 0 && completed.length === 0) {
    empty.style.display = '';
    activeLabel.style.display = 'none';
    compLabel.style.display = 'none';
    taskList.innerHTML = '';
    compList.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  activeLabel.style.display = active.length ? '' : 'none';
  compLabel.style.display = completed.length ? '' : 'none';

  taskList.innerHTML = active.map(t => taskCardHTML(t, false)).join('');
  compList.innerHTML = completed.map(t => taskCardHTML(t, true)).join('');

  // Attach swipe handlers
  taskList.querySelectorAll('.task-card').forEach(card => {
    const id = card.dataset.id;
    attachSwipe(card, id);
  });
  // Attach swipe-to-delete on spacers
  taskList.querySelectorAll('.section-spacer').forEach(spacer => {
    const id = spacer.dataset.id;
    let startX = 0;
    spacer.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
    spacer.addEventListener('touchmove', e => {
      const dx = e.touches[0].clientX - startX;
      if (dx < -10) { spacer.style.transform = 'translateX('+Math.max(dx,-140)+'px)'; spacer.style.opacity = Math.max(0.2, 1+dx/140); }
    }, {passive:true});
    spacer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      if (dx < -80) { deleteTask(id); }
      else { spacer.style.transform = ''; spacer.style.opacity = ''; }
    }, {passive:true});
  });

  // Attach drag handlers
  initDrag(taskList);
}

function taskCardHTML(task, isCompleted) {
  if (task.isHeader) {
    return `<div class="section-spacer" id="card-${task.id}" data-id="${task.id}">
      <div class="drag-handle" data-id="${task.id}" style="opacity:.15">&#8942;</div>
    </div>`;
  }
  const cat = CATEGORIES[task.category] || CATEGORIES.personal;
  const catStyle = `background:${cat.color}20;color:${cat.color}`;
  const subs = (task.subtasks || []);
  const doneCount = subs.filter(s => s.done).length;
  let subHTML = '';
  if (subs.length && task.isPillGroup) {
    subHTML = `<div class="pill-group">${subs.map((s, i) =>
      `<span class="pill-item${s.done?' pill-done':''}" onclick="event.stopPropagation();toggleSubtask('${task.id}',${i})">${esc(titleCase(s.text))}</span>`
    ).join('')}</div>`;
  } else if (subs.length) {
    subHTML = `<div class="subtask-list">${subs.map((s, i) =>
      `<div class="subtask${s.done?' subtask-done':''}" onclick="event.stopPropagation();toggleSubtask('${task.id}',${i})">
        <span class="subtask-check">${s.done?'\u2713':''}</span>
        <span class="subtask-text">${esc(titleCase(s.text))}</span>
      </div>`).join('')}</div>`;
  }
  const subMeta = subs.length ? `<span class="task-sub-count">${doneCount}/${subs.length}</span>` : '';
  return `<div class="task-card${isCompleted?' completed-card':''}" id="card-${task.id}" data-id="${task.id}" draggable="false">
    <div class="swipe-actions">
      <div class="swipe-act swipe-done">Done</div>
      <div class="swipe-act swipe-del">Delete</div>
    </div>
    ${subs.length ? '' : `<div class="task-check" onclick="completeTask('${task.id}')">${isCompleted?'\u2713':''}</div>`}
    <div class="task-body" onclick="openEditModal('${task.id}')">
      <div class="task-text">${esc(titleCase(task.text))}</div>
      <div class="task-meta">
        <span class="task-cat" style="${catStyle}">${cat.label}</span>
        ${task.priority ? '<span class="task-priority">\u2605</span>' : ''}
        ${subMeta}
      </div>
      ${subHTML}
    </div>
    ${task.dueTime ? `<div class="task-time">${fmt12(task.dueTime)}</div>` : ''}
    ${task.hold ? '<span class="task-hold-star">\u2605</span>' : ''}
    <div class="drag-handle" data-id="${task.id}">&#8942;</div>
  </div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function titleCase(s) {
  return s.replace(/(^|\s)\S/g, c => c.toUpperCase());
}

function fmt12(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const hr = h % 12 || 12;
  return m ? hr + ':' + String(m).padStart(2,'0') + ampm : hr + ampm;
}

// ===== SWIPE GESTURES =====
function attachSwipe(card, taskId) {
  let startX = 0, startY = 0, swiping = false;
  card.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swiping = false;
    card.style.transition = 'none';
  }, {passive: true});

  card.addEventListener('touchmove', function(e) {
    const dx = e.touches[0].clientX - startX;
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dy > 30 && !swiping) return;
    if (dx < -10) {
      swiping = true;
      e.preventDefault();
      const shift = Math.max(dx, -140);
      card.style.transform = 'translateX(' + shift + 'px)';
      const actions = card.querySelector('.swipe-actions');
      if (actions) actions.style.opacity = Math.min(1, Math.abs(dx) / 80);
    }
  }, {passive: false});

  card.addEventListener('touchend', function(e) {
    card.style.transition = 'transform .2s';
    if (card._dragging) { card.style.transform = 'translateX(0)'; swiping = false; return; }
    const dx = e.changedTouches[0].clientX - startX;
    if (dx < -100) {
      // Full swipe — complete or delete
      if (data.tasks.find(t => t.id === taskId && t.completedAt)) {
        deleteTask(taskId);
      } else {
        completeTask(taskId);
      }
    } else {
      card.style.transform = 'translateX(0)';
      const actions = card.querySelector('.swipe-actions');
      if (actions) actions.style.opacity = '0';
    }
    swiping = false;
  }, {passive: true});
}

// ===== SUBTASKS =====
function toggleSubtask(taskId, subIndex) {
  const task = data.tasks.find(t => t.id === taskId);
  if (!task || !task.subtasks) return;
  task.subtasks[subIndex].done = !task.subtasks[subIndex].done;
  // Auto-complete pill group when all pills are done
  if (task.isPillGroup && task.subtasks.every(s => s.done) && !task.completedAt) {
    task.completedAt = new Date().toISOString();
    recordCompletion(task);
    toast('All done!');
  }
  saveData();
  renderTasks();
}

// ===== DRAG & REORDER =====
function initDrag(taskList) {
  const DRAG_SEL = '.task-card:not(.completed-card), .section-spacer';
  const cards = Array.from(taskList.querySelectorAll(DRAG_SEL));
  if (cards.length < 2) return;

  cards.forEach(card => {
    const handle = card.querySelector('.drag-handle');
    if (!handle) return;

    let startY = 0, currentY = 0, dragging = false;
    let placeholder = null;
    let cardRect = null;

    function onDragStart(clientY) {
      dragging = true;
      card._dragging = true;
      startY = clientY;
      currentY = startY;
      cardRect = card.getBoundingClientRect();

      placeholder = document.createElement('div');
      placeholder.style.cssText = `height:${cardRect.height}px;border:2px dashed var(--accent);border-radius:var(--radius);opacity:0.3;margin:3px 0;transition:none`;
      card.parentNode.insertBefore(placeholder, card);

      card.style.position = 'fixed';
      card.style.top = cardRect.top + 'px';
      card.style.left = cardRect.left + 'px';
      card.style.width = cardRect.width + 'px';
      card.style.zIndex = '50';
      card.style.transition = 'none';
      card.style.opacity = '0.85';
      card.style.boxShadow = '0 8px 30px rgba(0,0,0,0.3)';
      card.style.transform = 'none';
    }

    function onDragMove(clientY) {
      if (!dragging) return;
      currentY = clientY;
      const dy = currentY - startY;
      card.style.top = (cardRect.top + dy) + 'px';

      let insertBefore = null;
      const currentCards = Array.from(taskList.querySelectorAll(DRAG_SEL));
      for (const sib of currentCards) {
        if (sib === card) continue;
        const r = sib.getBoundingClientRect();
        if (currentY < r.top + r.height / 2) {
          insertBefore = sib;
          break;
        }
      }

      if (insertBefore) {
        taskList.insertBefore(placeholder, insertBefore);
      } else {
        const lastActive = currentCards.filter(c => c !== card).pop();
        if (lastActive && lastActive.nextSibling) {
          taskList.insertBefore(placeholder, lastActive.nextSibling);
        } else {
          taskList.appendChild(placeholder);
        }
      }
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      setTimeout(() => { card._dragging = false; }, 50);

      card.style.position = '';
      card.style.top = '';
      card.style.left = '';
      card.style.width = '';
      card.style.zIndex = '';
      card.style.transition = '';
      card.style.opacity = '';
      card.style.boxShadow = '';
      card.style.transform = '';

      if (placeholder && placeholder.parentNode) {
        placeholder.parentNode.insertBefore(card, placeholder);
        placeholder.remove();
      }

      const newOrder = Array.from(taskList.querySelectorAll(DRAG_SEL)).map(c => c.dataset.id);
      reorderTasks(newOrder);
    }

    // Touch events (mobile)
    handle.addEventListener('touchstart', function(e) {
      e.preventDefault(); e.stopPropagation();
      onDragStart(e.touches[0].clientY);
    }, {passive: false});
    handle.addEventListener('touchmove', function(e) {
      e.preventDefault();
      onDragMove(e.touches[0].clientY);
    }, {passive: false});
    handle.addEventListener('touchend', function() { onDragEnd(); }, {passive: true});

    // Mouse events (desktop)
    handle.addEventListener('mousedown', function(e) {
      e.preventDefault(); e.stopPropagation();
      onDragStart(e.clientY);
      function onMM(ev) { ev.preventDefault(); onDragMove(ev.clientY); }
      function onMU() { onDragEnd(); document.removeEventListener('mousemove', onMM); document.removeEventListener('mouseup', onMU); }
      document.addEventListener('mousemove', onMM);
      document.addEventListener('mouseup', onMU);
    });
  });
}

function reorderTasks(newIdOrder) {
  // Separate active and completed tasks
  const completed = data.tasks.filter(t => t.completedAt);
  const reordered = [];
  for (const id of newIdOrder) {
    const task = data.tasks.find(t => t.id === id);
    if (task) reordered.push(task);
  }
  // Add any active tasks not in the new order (safety)
  for (const t of data.tasks) {
    if (!t.completedAt && !reordered.includes(t)) reordered.push(t);
  }
  data.tasks = [...reordered, ...completed];
  saveData();
  renderTasks();
}

function addEditSub() {
  const input = document.getElementById('editNewSub');
  const text = input.value.trim();
  if (!text) return;
  const container = document.getElementById('editSubs');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;align-items:center';
  div.innerHTML = `<input class="form-input edit-sub-input" value="${esc(text)}" style="flex:1">
    <span style="color:var(--red);cursor:pointer;font-size:1.1rem" onclick="this.parentElement.remove()">\u00D7</span>`;
  container.appendChild(div);
  input.value = '';
  input.focus();
}

function saveEdit(id) {
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;
  task.text = document.getElementById('editText').value.trim() || task.text;
  task.category = document.getElementById('editCat').value;
  task.dueTime = document.getElementById('editTime').value || null;
  task.priority = document.getElementById('editPriority').classList.contains('on') ? 1 : 0;
  task.hold = document.getElementById('editHold').classList.contains('on') ? 1 : 0;
  // Auto-add pending subtask from input
  const pendingSub = document.getElementById('editNewSub');
  if (pendingSub && pendingSub.value.trim()) {
    addEditSub();
  }
  // Collect subtasks
  const oldSubs = task.subtasks || [];
  const newSubs = [];
  document.querySelectorAll('.edit-sub-input').forEach((input, i) => {
    const v = input.value.trim();
    if (v) newSubs.push({text: v, done: oldSubs[i] ? oldSubs[i].done : false});
  });
  task.subtasks = newSubs;
  saveData();
  closeModal();
  renderTasks();
}

// ===== FREQUENCY ENGINE =====
function recordCompletion(task) {
  const key = task.text.toLowerCase().trim();
  const now = new Date();
  const entry = data.freq[key] || {
    count: 0, lastDone: null, avgGapDays: 0,
    category: task.category,
    dayDistribution: [0,0,0,0,0,0,0],
    timeSlots: {morning:0, afternoon:0, evening:0, night:0},
    streakWeeks: 0, lastSuggestedDate: null
  };

  entry.count++;

  // Update gap average (exponential moving average)
  if (entry.lastDone) {
    const gap = daysBetween(new Date(entry.lastDone), now);
    entry.avgGapDays = entry.avgGapDays === 0 ? gap : entry.avgGapDays * 0.7 + gap * 0.3;
  }

  entry.dayDistribution[now.getDay()]++;
  entry.timeSlots[getTimeSlot(now.getHours())]++;

  // Streak tracking
  const thisWeek = weekKey(now);
  const lastWeek = entry.lastDone ? weekKey(new Date(entry.lastDone)) : null;
  if (lastWeek) {
    const diff = weekDiff(lastWeek, thisWeek);
    if (diff <= 1) entry.streakWeeks = (entry.streakWeeks || 0) + (diff === 1 ? 1 : 0);
    else entry.streakWeeks = 1;
  } else {
    entry.streakWeeks = 1;
  }

  entry.lastDone = dateStr(now);
  entry.category = task.category;
  entry.textOriginal = task.text;
  if (task.isPillGroup) entry.isPillGroup = true;
  data.freq[key] = entry;

  // History
  data.history.push({
    text: key,
    textOriginal: task.text,
    category: task.category,
    completedAt: now.toISOString(),
    dayOfWeek: now.getDay(),
    hourOfDay: now.getHours(),
    timeSlot: getTimeSlot(now.getHours()),
    source: task.fromSuggestion ? 'suggestion' : task.fromTemplate ? 'template' : 'manual'
  });
}

function daysBetween(a, b) {
  return Math.round(Math.abs(b - a) / 86400000);
}

function dateStr(d) {
  return d.toISOString().split('T')[0];
}

function weekKey(d) {
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + week;
}

function weekDiff(w1, w2) {
  const [y1, n1] = w1.split('-W').map(Number);
  const [y2, n2] = w2.split('-W').map(Number);
  return Math.abs((y2 * 52 + n2) - (y1 * 52 + n1));
}

// ===== PRUNE HISTORY =====
function pruneHistory() {
  const lastPrune = localStorage.getItem('cadence_last_prune');
  const today = dateStr(new Date());
  if (lastPrune === today) return;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (data.settings.completedRetention || 90));
  const cutoffStr = cutoff.toISOString();
  data.history = data.history.filter(h => h.completedAt > cutoffStr);
  // Also clean completed tasks older than 24h
  data.tasks = data.tasks.filter(t => {
    if (!t.completedAt) return true;
    if (t.hold) return true;
    if (t.isHeader) return true;
    return new Date(t.completedAt) > new Date(Date.now() - 86400000);
  });
  saveData();
  localStorage.setItem('cadence_last_prune', today);
}

// ===== SMART SUGGESTIONS =====
function computeSuggestions() {
  const now = new Date();
  const todayDOW = now.getDay();
  const currentSlot = getTimeSlot(now.getHours());
  const today = dateStr(now);
  const activeTasks = new Set(data.tasks.filter(t => !t.completedAt).map(t => t.text.toLowerCase().trim()));

  const results = [];

  for (const [key, entry] of Object.entries(data.freq)) {
    // Skip if already active
    if (activeTasks.has(key)) continue;
    // Skip if already suggested today and dismissed
    if (entry.lastSuggestedDate === today) continue;
    if (entry.count < 2) continue; // need at least 2 completions

    let score = 0;
    let reasons = [];

    // Frequency score (0-40)
    if (entry.avgGapDays > 0 && entry.lastDone) {
      const daysSince = daysBetween(new Date(entry.lastDone), now);
      if (daysSince >= entry.avgGapDays * 0.8) {
        score += Math.min(30, 30 * daysSince / entry.avgGapDays);
        const gap = Math.round(entry.avgGapDays);
        if (gap === 1) reasons.push('Daily');
        else if (gap <= 7) reasons.push('Every ' + gap + ' days');
        else reasons.push('Every ' + Math.round(gap/7) + ' weeks');
      }
    }
    if (entry.count >= 10) score += 5;
    if (entry.count >= 25) score += 5;

    // Day-of-week score (0-25)
    const daySum = entry.dayDistribution.reduce((a,b) => a + b, 0);
    if (daySum > 0) {
      const dayPct = entry.dayDistribution[todayDOW] / daySum;
      if (dayPct > 0.2) {
        score += 25 * dayPct;
        reasons.push('Usually ' + DAY_NAMES[todayDOW] + 's');
      }
    }

    // Time-of-day score (0-20)
    const slotSum = Object.values(entry.timeSlots).reduce((a,b) => a + b, 0);
    if (slotSum > 0) {
      const slotPct = (entry.timeSlots[currentSlot] || 0) / slotSum;
      if (slotPct > 0.25) {
        score += 20 * slotPct;
        reasons.push(TIME_SLOTS[currentSlot]);
      }
    }

    // Recency score (0-15)
    if (entry.lastDone) {
      const daysSince = daysBetween(new Date(entry.lastDone), now);
      if (daysSince <= 7) score += 15 * (1 - daysSince / 7);
      else if (daysSince > 30) score -= 10;
    }

    // Streak bonus (0-10)
    if (entry.streakWeeks >= 4) {
      score += Math.min(10, entry.streakWeeks);
      reasons.push(entry.streakWeeks + '-week streak');
    }

    if (score >= 12) {
      results.push({
        text: entry.textOriginal || key,
        key: key,
        score: score,
        reason: reasons[0] || (entry.count + 'x done'),
        category: entry.category
      });
    }
  }

  // Show selected category's suggestions first, then fill with others
  const catResults = results.filter(r => r.category === selectedCategory);
  const otherResults = results.filter(r => r.category !== selectedCategory);
  catResults.sort((a, b) => b.score - a.score);
  otherResults.sort((a, b) => b.score - a.score);
  return catResults.concat(otherResults).slice(0, 8);
}

function renderSuggestions() {
  if (!data.settings.suggestionsEnabled) {
    document.getElementById('suggestionsSection').style.display = 'none';
    return;
  }
  const suggestions = computeSuggestions();
  const section = document.getElementById('suggestionsSection');
  const pills = document.getElementById('suggestionPills');
  if (suggestions.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  pills.innerHTML = suggestions.map(s => {
    return `<div class="s-pill" onclick="addFromSuggestion('${esc(s.key)}','${s.category}','${esc(s.text)}')">
      ${esc(s.text)}
      <span class="s-reason">${esc(s.reason)}</span>
    </div>`;
  }).join('');
}

function addFromSuggestion(key, category, text) {
  const freqEntry = data.freq[key];
  const task = addTask(text, category, {fromSuggestion: true});
  // Restore pill group if the original was one
  if (freqEntry && freqEntry.isPillGroup && text.includes('/')) {
    const items = text.split('/').map(s => s.trim()).filter(s => s);
    if (items.length >= 2) {
      task.subtasks = items.map(item => ({text: item, done: false}));
      task.isPillGroup = true;
      saveData();
      renderTasks();
    }
  }
  toast('Added from suggestion');
}

// ===== AUTOCOMPLETE =====
function getAutocomplete(input) {
  const q = input.toLowerCase().trim();
  if (q.length < 2) return [];
  return Object.entries(data.freq)
    .filter(([key]) => key.includes(q))
    .sort((a, b) => {
      const aCat = a[1].category === selectedCategory ? 1 : 0;
      const bCat = b[1].category === selectedCategory ? 1 : 0;
      if (bCat !== aCat) return bCat - aCat;
      return b[1].count - a[1].count;
    })
    .slice(0, 5)
    .map(([key, entry]) => ({
      text: entry.textOriginal || key,
      category: entry.category,
      count: entry.count
    }));
}

function onTaskInput() {
  const input = document.getElementById('taskInput').value;
  const results = getAutocomplete(input);
  const ac = document.getElementById('autocomplete');
  if (results.length === 0) {
    ac.classList.remove('open');
    acIndex = -1;
    return;
  }
  ac.innerHTML = results.map((r, i) => {
    const cat = CATEGORIES[r.category] || CATEGORIES.personal;
    return `<div class="ac-item${i===acIndex?' selected':''}" onclick="selectAutocomplete(${i})">
      <span class="ac-text">${esc(r.text)}</span>
      <span class="ac-meta">${r.count}x \u00B7 ${cat.label}</span>
    </div>`;
  }).join('');
  ac.classList.add('open');
  ac._results = results;
}

function onTaskKeydown(e) {
  const ac = document.getElementById('autocomplete');
  const results = ac._results || [];
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acIndex = Math.min(acIndex + 1, results.length - 1);
    onTaskInput();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acIndex = Math.max(acIndex - 1, -1);
    onTaskInput();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (acIndex >= 0 && results[acIndex]) {
      selectAutocomplete(acIndex);
    } else {
      addTaskFromInput();
    }
  } else if (e.key === 'Escape') {
    ac.classList.remove('open');
    acIndex = -1;
  }
}

function selectAutocomplete(i) {
  const ac = document.getElementById('autocomplete');
  const results = ac._results || [];
  if (!results[i]) return;
  document.getElementById('taskInput').value = results[i].text;
  selectedCategory = results[i].category;
  document.getElementById('catBtn').textContent = (CATEGORIES[selectedCategory]||CATEGORIES.personal).label.toLowerCase();
  ac.classList.remove('open');
  acIndex = -1;
  addTaskFromInput();
}

// ===== TEMPLATE SUGGESTIONS (TODAY VIEW) =====
function renderTemplateSuggestions() {
  const el = document.getElementById('tmplSuggestions');
  if (!data.settings.templateAutoLoad || data.templates.length === 0) {
    el.innerHTML = '';
    return;
  }
  const dow = new Date().getDay();
  const today = dateStr(new Date());
  const dismissed = JSON.parse(sessionStorage.getItem('cadence_tmpl_dismissed') || '[]');

  const matching = data.templates.filter(t => {
    if (dismissed.includes(t.id)) return false;
    if (t.lastUsedDate === today) return false;
    if (t.autoDay === null || t.autoDay === undefined) return false;
    if (t.autoDay === 7) return true; // daily
    if (t.autoDay === 8) return dow >= 1 && dow <= 5; // weekdays
    if (t.autoDay === 9) return dow === 0 || dow === 6; // weekends
    return t.autoDay === dow;
  });

  if (matching.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = matching.map(t => {
    return `<div class="tmpl-banner">
      <div class="tmpl-banner-text"><strong>${esc(t.name)}</strong> \u00B7 ${t.items.length} items</div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="tmpl-banner-btn" onclick="loadTemplate('${t.id}')">Load</button>
        <span class="tmpl-banner-x" onclick="dismissTmplBanner('${t.id}')">\u00D7</span>
      </div>
    </div>`;
  }).join('');
}

function dismissTmplBanner(id) {
  const dismissed = JSON.parse(sessionStorage.getItem('cadence_tmpl_dismissed') || '[]');
  dismissed.push(id);
  sessionStorage.setItem('cadence_tmpl_dismissed', JSON.stringify(dismissed));
  renderTemplateSuggestions();
}

function renderRoutines() {

  if (data.templates.length === 0) {

    return `<div class="tmpl-card" onclick="openTemplateDetail('${t.id}')">
      <div class="tmpl-header">
        <span class="tmpl-name">${esc(t.name)}</span>

      </div>

function getAutoDayLabel(d) {
  if (d === null || d === undefined) return '';
  if (d === 7) return 'Daily';
  if (d === 8) return 'Weekdays';
  if (d === 9) return 'Weekends';
  return FULL_DAYS[d] + 's';
}

function openTemplateModal(editId) {
  const tmpl = editId ? data.templates.find(t => t.id === editId) : null;
  const name = tmpl ? tmpl.name : '';
  const items = tmpl ? tmpl.items : [];
  const category = tmpl ? tmpl.category : 'personal';

  for (const [k,v] of Object.entries(CATEGORIES)) {
    catOpts += `<option value="${k}"${category===k?' selected':''}>${v.label}</option>`;

  FULL_DAYS.forEach((d, i) => dayOpts += `<option value="${i}"${autoDay===i?' selected':''}>${d}</option>`);
  dayOpts += `<option value="7"${autoDay===7?' selected':''}>Daily</option>`;
  dayOpts += `<option value="8"${autoDay===8?' selected':''}>Weekdays</option>`;
  dayOpts += `<option value="9"${autoDay===9?' selected':''}>Weekends</option>`;

  openModal(`
    <div class="modal-title">${tmpl ? 'Edit' : 'New'} Routine</div>
    <div class="form-group">
      <label class="form-label">Name</label>
      <input class="form-input" id="tmplName" value="${esc(name)}" placeholder="e.g. Weekly Groceries">
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="tmplCat">${catOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Auto-suggest on</label>
      <select class="form-select" id="tmplDay">${dayOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Items</label>
      <div id="tmplItems" style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        ${items.map((item, i) => `<div style="display:flex;gap:6px;align-items:center">
          <input class="form-input tmpl-item-input" value="${esc(item)}" style="flex:1">
          <span style="color:var(--red);cursor:pointer;font-size:1.1rem" onclick="this.parentElement.remove()">\u00D7</span>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <input class="form-input" id="tmplNewItem" placeholder="Add item..." style="flex:1"
               onkeydown="if(event.key==='Enter'){event.preventDefault();addTmplItem()}">
        <button class="form-btn" onclick="addTmplItem()" style="width:auto;padding:8px 16px">+</button>
      </div>
    </div>
    <button class="form-btn" onclick="saveTemplate('${editId||''}')" style="margin-bottom:10px">Save</button>
    ${tmpl ? `<button class="form-btn form-btn-danger" onclick="deleteTemplate('${editId}')">Delete</button>` : ''}
  `);
}

function addTmplItem() {
  const input = document.getElementById('tmplNewItem');
  const text = input.value.trim();
  if (!text) return;
  const container = document.getElementById('tmplItems');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;align-items:center';
  div.innerHTML = `<input class="form-input tmpl-item-input" value="${esc(text)}" style="flex:1">
    <span style="color:var(--red);cursor:pointer;font-size:1.1rem" onclick="this.parentElement.remove()">\u00D7</span>`;
  container.appendChild(div);
  input.value = '';
  input.focus();
}

function saveTemplate(editId) {
  const name = document.getElementById('tmplName').value.trim();
  if (!name) { toast('Name is required'); return; }
  const items = [];
  document.querySelectorAll('.tmpl-item-input').forEach(input => {
    const v = input.value.trim();
    if (v) items.push(v);
  });
  if (items.length === 0) { toast('Add at least one item'); return; }
  const category = document.getElementById('tmplCat').value;
  const dayVal = document.getElementById('tmplDay').value;
  const autoDay = dayVal === '' ? null : parseInt(dayVal);

  if (editId) {
    const tmpl = data.templates.find(t => t.id === editId);
    if (tmpl) {
      tmpl.name = name;
      tmpl.items = items;
      tmpl.category = category;
      tmpl.autoDay = autoDay;
    }
  } else {
    data.templates.push({
      id: genId('tmpl'),
      name: name,
      items: items,
      category: category,
      lastUsed: null,
      lastUsedDate: null,
      useCount: 0,
      autoDay: autoDay
    });
  }
  saveData();
  closeModal();
  renderRoutines();
  toast(editId ? 'Routine updated' : 'Routine created');
}

function deleteTemplate(id) {
  data.templates = data.templates.filter(t => t.id !== id);
  saveData();
  closeModal();
  renderRoutines();
  toast('Routine deleted');
}

function openTemplateDetail(id) {
  const tmpl = data.templates.find(t => t.id === id);
  if (!tmpl) return;
  openModal(`
    <div class="modal-title">${esc(tmpl.name)}</div>
    <div style="margin-bottom:16px">
      ${tmpl.items.map(item => `<div style="padding:8px 0;border-bottom:1px solid var(--card-border);color:var(--text-bright);font-size:.9rem">${esc(item)}</div>`).join('')}
    </div>
    <button class="form-btn" onclick="loadTemplate('${id}')" style="margin-bottom:10px">Load All Tasks</button>
    <button class="form-btn form-btn-outline" onclick="openTemplateModal('${id}')" style="margin-bottom:10px">Edit</button>
  `);
}

function loadTemplate(id) {
  const tmpl = data.templates.find(t => t.id === id);
  if (!tmpl) return;
  let added = 0;
  tmpl.items.forEach(item => {
    // Don't add duplicates
    const exists = data.tasks.some(t => !t.completedAt && t.text.toLowerCase() === item.toLowerCase());
    if (!exists) {
      addTask(item, tmpl.category, {fromTemplate: tmpl.id});
      added++;
    }
  });
  tmpl.useCount = (tmpl.useCount || 0) + 1;
  tmpl.lastUsed = new Date().toISOString();
  tmpl.lastUsedDate = dateStr(new Date());
  saveData();
  closeModal();
  renderTasks();
  renderTemplateSuggestions();
  toast(added + ' tasks added from ' + tmpl.name);
}

// ===== WEEKLY GOALS =====
function getWeekKey() {
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - jan1) / 86400000);
  const week = Math.ceil((days + jan1.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + String(week).padStart(2, '0');
}

function getWeekLabel() {
  const d = new Date();
  const day = d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate() - ((day + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = function(dt) { return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'}); };
  return fmt(mon) + ' – ' + fmt(sun);
}

function getWeeklyVal(itemId) {
  const wk = getWeekKey();
  return (data.weekly.log[wk] && data.weekly.log[wk][itemId]) || 0;
}

function renderWeekly() {
  const items = data.weekly.items || [];
  document.getElementById('weeklyWeek').textContent = getWeekLabel();

  // Progress
  const metCount = items.filter(function(i) { return getWeeklyVal(i.id) >= i.target; }).length;
  const progEl = document.getElementById('weeklyProgress');
  progEl.textContent = items.length ? metCount + '/' + items.length : '';

  // Collapse state
  const collapsed = localStorage.getItem('cadence_weekly_collapsed') === '1';
  const body = document.getElementById('weeklyBody');
  const chev = document.getElementById('weeklyChevron');
  if (collapsed) { body.classList.add('collapsed'); chev.classList.add('collapsed'); }
  else { body.classList.remove('collapsed'); chev.classList.remove('collapsed'); }

  // Render items
  const el = document.getElementById('weeklyItems');
  if (items.length === 0) {
    el.innerHTML = '<div style="font-size:.78rem;color:var(--text-dim);padding:8px 0">No weekly goals yet. Add things like gym, reading, running...</div>';
    return;
  }
  el.innerHTML = items.map(function(i) {
    const val = getWeeklyVal(i.id);
    var targetMins = i.unit === 'hrs' ? i.target * 60 : i.target;
    const pct = Math.min(100, Math.round((val / targetMins) * 100));
    const done = val >= targetMins;
    var label;
    if (i.unit === 'hrs') {
      var h = Math.floor(val / 60), m = Math.round(val % 60);
      label = (h ? h + 'h ' : '') + m + 'm / ' + i.target + 'h';
    } else {
      label = val + '/' + i.target;
    }
    return '<div class="weekly-item' + (done ? ' w-done' : '') + '">' +
      '<div class="weekly-item-info" onclick="logWeeklyProgress(\'' + i.id + '\')">' +
        '<div class="weekly-item-top">' +
          '<span class="weekly-item-text">' + esc(titleCase(i.text)) + '</span>' +
          '<span class="weekly-item-count">' + label + '</span>' +
        '</div>' +
        '<div class="weekly-bar"><div class="weekly-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="weekly-item-del" onclick="deleteWeeklyItem(\'' + i.id + '\')">\u00D7</div>' +
    '</div>';
  }).join('');
}

function logWeeklyProgress(itemId) {
  const item = data.weekly.items.find(function(i) { return i.id === itemId; });
  if (!item) return;
  const wk = getWeekKey();
  if (!data.weekly.log[wk]) data.weekly.log[wk] = {};

  if (item.unit === 'hrs') {
    const current = data.weekly.log[wk][itemId] || 0;
    var ch = Math.floor(current / 60), cm = Math.round(current % 60);
    var currentLabel = (ch ? ch + 'h ' : '') + cm + 'm';
    const input = prompt('Log minutes for ' + item.text + ' (current: ' + currentLabel + ' / ' + item.target + 'h)', '30');
    if (input === null) return;
    const val = parseInt(input);
    if (isNaN(val) || val <= 0) return;
    data.weekly.log[wk][itemId] = current + val;
  } else {
    data.weekly.log[wk][itemId] = (data.weekly.log[wk][itemId] || 0) + 1;
  }

  // Clean old weeks (keep last 4)
  const keys = Object.keys(data.weekly.log).sort();
  while (keys.length > 4) { delete data.weekly.log[keys.shift()]; }
  saveData();
  renderWeekly();
  const targetMins = item.unit === 'hrs' ? item.target * 60 : item.target;
  const newVal = data.weekly.log[wk][itemId];
  if (newVal >= targetMins) toast(item.text + ' goal met!');
}

function addWeeklyItem() {
  const nameInput = document.getElementById('weeklyNameInput');
  const targetInput = document.getElementById('weeklyTargetInput');
  const unitBtn = document.getElementById('weeklyUnitBtn');
  const text = nameInput.value.trim();
  if (!text) return;
  const target = parseInt(targetInput.value) || 1;
  const unit = unitBtn.textContent;
  const id = 'w' + Date.now();
  data.weekly.items.push({id: id, text: text, target: target, unit: unit});
  saveData();
  nameInput.value = '';
  targetInput.value = '1';
  renderWeekly();
  toast('Weekly goal added');
}

function deleteWeeklyItem(itemId) {
  data.weekly.items = data.weekly.items.filter(function(i) { return i.id !== itemId; });
  saveData();
  renderWeekly();
  toast('Weekly goal removed');
}

function toggleWeeklyUnit() {

  btn.textContent = btn.textContent === 'times' ? 'hrs' : 'times';
}

function toggleWeeklyOpen() {
  const body = document.getElementById('weeklyBody');
  const chev = document.getElementById('weeklyChevron');

// ===== MONTHLY TO-DO =====
function getMonthKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function getMonthLabel() {
  return new Date().toLocaleDateString('en-US', {month: 'long', year: 'numeric'});
}

function isMonthlyDone(itemId) {
  const mk = getMonthKey();
  return !!(data.monthly.done[mk] && data.monthly.done[mk].includes(itemId));
}

function toggleMonthlyItem(itemId) {
  const mk = getMonthKey();
  if (!data.monthly.done[mk]) data.monthly.done[mk] = [];
  const arr = data.monthly.done[mk];
  const idx = arr.indexOf(itemId);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(itemId);
  // Clean old months (keep last 3)
  const keys = Object.keys(data.monthly.done).sort();
  while (keys.length > 3) { delete data.monthly.done[keys.shift()]; }
  saveData();
  renderMonthly();
}

function addMonthlyItem() {
  const input = document.getElementById('monthlyInput');
  const text = input.value.trim();
  if (!text) return;
  const id = 'm' + Date.now();
  data.monthly.items.push({id: id, text: text});
  saveData();
  input.value = '';
  renderMonthly();
  toast('Monthly item added');
}

function deleteMonthlyItem(itemId) {

  saveData();
  renderMonthly();
  toast('Monthly item removed');
}

function toggleMonthlyOpen() {

  chev.classList.toggle('collapsed');
  localStorage.setItem('cadence_monthly_collapsed', body.classList.contains('collapsed') ? '1' : '');
